# Builds the Windows installer and publishes it on the Releases page.
# Runs when package.json changes on main (that is where the version number lives), or by hand from the Actions page.
# electron-builder makes the release (and its tag, for example v1.0.1); installed programs find it and update themselves.
name: Build Windows installer
on:
  push:
    branches: [main]
    paths: ['package.json', 'main.js', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
