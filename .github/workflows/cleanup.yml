# One-off: removes the tags left by the two incomplete builds (v1.0.0, v1.0.1). Deleted again right after it runs.
name: Remove old tags
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup.yml']
permissions:
  contents: write
jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git push origin --delete v1.0.0 v1.0.1 || true
